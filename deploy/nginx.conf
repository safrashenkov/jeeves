# Вариант А (так развёрнуто на kmb-5): добавить два location в УЖЕ СУЩЕСТВУЮЩИЙ
# server-блок vhost'а jeeves.perm-bear.ru (/etc/nginx/sites-enabled/jeeves.perm-bear.ru),
# в секцию с listen 443 ssl. Точное совпадение (=) приоритетнее regex-локаций PHP,
# поэтому старые PHP-скрипты продолжают работать.

    location = /webhook {
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:18090;
    }

